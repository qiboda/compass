[workspace]
resolver = "3"
members = [
    "crates/compass-core",
    "crates/compass",
    "crates/compass-data",
]

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "1", features = ["bundled", "parquet"] }
egui = "0.33"
eframe = "0.33"
egui-charts = "0.2"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"


httpmock = "0.8"
rstest = "0.25"
tempfile = "3"
criterion = "0.5"
# Profiling (behind the "tracy" feature)
tracing-tracy = "0.11"
tracy-client-sys = { version = "0.24", default-features = false }
