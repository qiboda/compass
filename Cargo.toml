[package]
name = "compass"
version = "0.1.0"
edition = "2024"

[lib]
name = "compass_rs"
path = "src/lib.rs"

[[bin]]
name = "compass"
path = "src/main.rs"

[[bin]]
name = "compass-downloader"
path = "src/bin/downloader.rs"

[dependencies]
egui = "0.33"
eframe = "0.33"
egui-charts = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
duckdb = { version = "1", features = ["bundled", "parquet"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
async-trait = "0.1"
rand = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
futures = "0.3"

[dev-dependencies]
rstest = "0.25"
httpmock = "0.8"
