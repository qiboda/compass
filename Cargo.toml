[workspace]
resolver = "3"
members = [
    "crates/compass-core",
    "crates/compass",
    "crates/compass-data",
    "crates/compass-i18n",
    "crates/compass-types",
    "crates/compass-strategy",
    "crates/compass-ui",
    "crates/compass-collectors",
]

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rust-i18n = "4.2.1"
duckdb = { version = "1", features = ["bundled", "parquet"] }
egui = "0.35"
egui_extras = "0.35"
eframe = "0.35"
egui-charts = { git = "https://github.com/qiboda/egui-charts.git", branch = "compass" }
egui_dock = "0.20"
egui-phosphor = "0.13"
emath = "0.35"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
csv = "1"
regex = "1"
url = "2"
wreq = { version = "0.16", features = ["json", "query", "gzip", "brotli", "zstd", "cookies"] }
wreq-util = "0.2"


httpmock = "0.8"
rstest = "0.25"
tempfile = "3"
egui_kittest = { version = "0.35", features = ["eframe"] }
criterion = "0.5"
# Profiling (behind the "tracy" feature)
tracing-tracy = "0.11"
tracy-client-sys = { version = "0.24", default-features = false }
