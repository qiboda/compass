[package]
name = "compass"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
compass-core = { path = "../compass-core" }
chrono = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui-charts = { workspace = true }
egui-phosphor = "0.13"
egui-file-dialog = "0.14"
egui_dock = "0.20"
egui_mobius = "0.5"
egui_mobius_reactive = "0.5"
egui_lens = "0.5"
egui_citizen = { git = "https://github.com/saturn77/egui_mobius.git", rev = "cc286df7" }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }

[features]
tracy = ["dep:tracing-tracy", "dep:tracy-client-sys", "tracy-client-sys/enable", "compass-core/tracy"]

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe"] }
rstest = { workspace = true }
tempfile = { workspace = true }
