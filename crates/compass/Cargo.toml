[package]
name = "compass"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
compass-core = { path = "../compass-core" }
anyhow = { workspace = true }
chrono = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui-charts = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }

[features]
tracy = ["dep:tracing-tracy", "dep:tracy-client-sys", "tracy-client-sys/enable", "compass-core/tracy"]
