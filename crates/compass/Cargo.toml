[package]
name = "compass"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "compass"
path = "src/main.rs"

# rust-i18n default locale: the GUI's product default is zh (issue #222).
# Without this, rust-i18n's built-in default ("en") makes t!() calls in the
# compass crate resolve to English wherever main()'s set_locale has not run
# (unit tests, kittest harnesses) and breaks the zh-literal test contract.
[package.metadata.i18n]
default-locale = "zh"

[dependencies]
compass-core = { path = "../compass-core" }
compass-types = { path = "../compass-types" }
compass-strategy = { path = "../compass-strategy" }
compass-ui = { path = "../compass-ui" }
compass-i18n = { path = "../compass-i18n" }
rust-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-charts = { workspace = true }
egui-phosphor = "0.13"
egui-file-dialog = "0.14"
egui_dock = "0.20"
egui_mobius = "0.5"
egui_mobius_reactive = "0.5"
egui_lens = "0.5"
egui_citizen = { git = "https://github.com/saturn77/egui_mobius.git", rev = "cc286df7" }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }

[features]
tracy = ["dep:tracing-tracy", "dep:tracy-client-sys", "tracy-client-sys/enable", "compass-core/tracy"]

[dev-dependencies]
duckdb = { workspace = true }
egui_kittest = { version = "0.35", features = ["eframe"] }
rstest = { workspace = true }
tempfile = { workspace = true }
