name: opencode-ci-fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Create CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          gh issue create \
            --title "CI Failure: ${HEAD_BRANCH}" \
            --label "A-CI,C-Bug,S-CI-Failure" \
            --body "CI workflow **failed** on branch \`${HEAD_BRANCH}\`.

          **Commit**: ${HEAD_SHA}

          Details: ${RUN_URL}"
