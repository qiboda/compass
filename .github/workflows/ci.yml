name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + build + clippy + docs + nextest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo fmt --check
      - run: cargo build --verbose
      - run: cargo clippy -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and collect coverage (nextest semantics)
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --json --summary-only --output-path target/llvm-cov/coverage.json
      - name: "Enforce coverage gate (per-crate thresholds: core/data/i18n/strategy/types/ui 95%, compass 90%, workspace 93%)"
        run: bash scripts/check-coverage.sh target/llvm-cov/coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/

  bench-check:
    name: Bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo bench --no-run

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: cd collectors && uv sync && uv run ruff check *.py tests/

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - run: cd collectors && uv sync && uv run pytest tests/ --cov=. --cov-fail-under=95 --cov-report=term-missing
