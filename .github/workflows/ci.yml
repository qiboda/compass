name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - run: cargo build --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - run: cargo clippy -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  bench-check:
    name: Bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - run: cargo bench --no-run

  nextest:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Workspace coverage gate
        run: cargo llvm-cov --html --fail-under-lines 80
      - name: compass-core coverage gate
        run: cargo llvm-cov -p compass-core --fail-under-lines 80
      - name: compass-data coverage gate
        run: cargo llvm-cov -p compass-data --fail-under-lines 80
      - name: compass coverage gate
        run: cargo llvm-cov -p compass --fail-under-lines 80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: cd collectors && uv sync && uv run ruff check *.py tests/

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - run: cd collectors && uv sync && uv run pytest tests/ --cov=. --cov-fail-under=80 --cov-report=term-missing
