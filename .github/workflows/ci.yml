name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + build + clippy + docs + nextest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo fmt --check
      - run: cargo build --verbose
      - run: cargo clippy -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Clean heavy target artifacts before coverage
        run: |
          rm -rf target/debug target/doc
          df -h .
      - name: Run tests and collect coverage (nextest semantics)
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --json --summary-only --output-path target/llvm-cov/coverage.json
      - name: "Enforce coverage gate (per-crate thresholds: core/data/i18n/strategy/types/ui 95%, compass 90%, workspace 93%)"
        run: bash scripts/check-coverage.sh target/llvm-cov/coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/

  bench-check:
    name: Bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          prefix-key: ${{ github.job }}
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo bench --no-run

  prune-caches:
    name: Prune stale CI caches (master only)
    # rust-cache 仅允许 master 保存缓存（save-if）；rustc/toolchain 升级导致
    # envHash 变化后旧 key 永不命中，这里按 job 分组保留最新一份、删除其余。
    # 与 save-if 对称：只在 master 清理，其它分支的缓存（若有）不触碰。
    if: github.ref == 'refs/heads/master'
    needs: [rust, bench-check]
    runs-on: ubuntu-latest
    # 删除缓存需 actions: write（默认 GITHUB_TOKEN 仅 contents: read）
    permissions:
      contents: read
      actions: write
    # 清理失败不影响 CI 结果（缓存管理问题不外溢为构建失败）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/prune-actions-caches.sh
      - name: "Dry-run: show what would be pruned"
        run: DRY_RUN=1 bash scripts/prune-actions-caches.sh
      - name: Prune stale caches
        run: bash scripts/prune-actions-caches.sh

