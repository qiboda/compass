name: opencode-impl

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  impl:
    if: contains(github.event.comment.body, '/impl')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOKEN: ${{ github.token }}
        with:
          model: deepseek/deepseek-v4-pro
          use_github_token: "true"
          prompt: |
            Read AGENTS.md for project conventions, then read kb/github/impl.md
            for your full role instructions. Follow them exactly.
