[project]
name = "compass-collectors"
version = "0.1.0"
description = "Compass data pipeline — EastMoney API collectors"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15",
    "requests>=2.32",
    "tenacity>=9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["*.py", "tests/"]
